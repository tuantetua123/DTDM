<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Việc cần làm</title>
<style>
:root{
  --bg1:#6366f1; --bg2:#ec4899; --card:rgba(255,255,255,.84); --text:#1f2937; --muted:#6b7280;
  --line:rgba(0,0,0,.08); --accent:#6366f1; --accent2:#8b5cf6; --input:#fff; --danger:#ef4444;
  --shadow:0 20px 60px rgba(31,41,55,.25);
}
:root[data-theme="dark"]{
  --bg1:#0f172a; --bg2:#312e81; --card:rgba(30,41,59,.85); --text:#e5e7eb; --muted:#94a3b8;
  --line:rgba(255,255,255,.08); --input:#1e293b; --shadow:0 20px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:32px 14px;color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;transition:background .4s}
.app{max-width:720px;margin:0 auto;background:var(--card);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
header{padding:28px 28px 20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;position:relative}
header h1{margin:0;font-size:26px}
header p{margin:4px 0 16px;opacity:.85;font-size:14px}
.theme{position:absolute;top:22px;right:22px;border:0;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer;transition:.2s}
.theme:hover{background:rgba(255,255,255,.35);transform:rotate(20deg)}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.stats{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;opacity:.85}
main{padding:22px 28px 28px}
.add{display:flex;gap:10px}
input[type=text],select,input[type=date]{padding:12px 14px;font-size:14px;border-radius:14px;border:2px solid transparent;
  background:var(--input);color:var(--text);outline:none;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.2s;font-family:inherit}
input[type=text]:focus,select:focus,input[type=date]:focus{border-color:var(--accent)}
.add input[type=text]{flex:1;font-size:15px;min-width:0}
.opts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.opts select,.opts input{flex:1;min-width:120px}
.btn{border:0;padding:0 22px;border-radius:14px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(99,102,241,.4);transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.tools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.tools input{flex:2;min-width:150px}
.tools select{flex:1;min-width:130px}
.tabs{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap;align-items:center}
.tab{border:0;padding:8px 16px;border-radius:99px;background:transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;transition:.2s}
.tab:hover{background:var(--line)}
.tab.active{background:var(--accent);color:#fff}
.sp{flex:1}
.mini{border:0;padding:8px 12px;border-radius:10px;background:var(--line);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.mini:hover{background:var(--accent);color:#fff}
.mini.red:hover{background:var(--danger)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:14px 8px;border-bottom:1px solid var(--line);animation:in .35s ease both}
li.removing{animation:out .3s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(40px)}}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);
  cursor:pointer;flex:none;display:grid;place-content:center;transition:.2s}
.chk:checked{background:linear-gradient(135deg,#10b981,#34d399);border-color:transparent}
.chk:checked::after{content:"✓";color:#fff;font-size:15px;font-weight:700}
.txt{flex:1;font-size:16px;word-break:break-word;min-width:0}
li.done .txt b{text-decoration:line-through;color:var(--muted);font-weight:400}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--muted);border:0;font-family:inherit}
button.chip{cursor:pointer}
.p1{background:rgba(239,68,68,.15);color:#ef4444}
.p2{background:rgba(245,158,11,.15);color:#d97706}
.p3{background:rgba(16,185,129,.15);color:#059669}
.due-over{background:rgba(239,68,68,.15);color:#ef4444}
.due-today{background:rgba(245,158,11,.18);color:#d97706}
.edit-in{flex:1;padding:8px 12px;font-size:16px;border-radius:10px;border:2px solid var(--accent);background:var(--input);color:var(--text);outline:none}
.ico{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:10px;cursor:pointer;
  display:grid;place-content:center;transition:.2s;opacity:.6;position:relative}
li:hover .ico{opacity:1}
.ico:hover{background:var(--line);color:var(--accent)}
.ico.del:hover{color:var(--danger);background:rgba(239,68,68,.12)}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hid{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:0;bottom:0}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty div{font-size:48px;margin-bottom:6px}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
kbd{background:var(--line);padding:2px 7px;border-radius:6px;font-size:11px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);background:#111827;color:#fff;
  padding:12px 22px;border-radius:99px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.3);z-index:9}
.toast.show{transform:translate(-50%,0)}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
@media(max-width:480px){header,main{padding-left:16px;padding-right:16px}.btn{padding:0 16px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="theme" id="theme" title="Đổi giao diện">🌙</button>
    <h1>✨ Việc cần làm</h1>
    <p id="hello"></p>
    <div class="bar"><i id="bar"></i></div>
    <div class="stats">
      <div class="stat"><b id="sAll">0</b><span>Tổng</span></div>
      <div class="stat"><b id="sTodo">0</b><span>Đang làm</span></div>
      <div class="stat"><b id="sDone">0</b><span>Hoàn thành</span></div>
      <div class="stat"><b id="sLate">0</b><span>Quá hạn</span></div>
    </div>
  </header>
  <main>
    <div class="add">
      <input id="name" type="text" placeholder="Bạn cần làm gì hôm nay?" maxlength="200" autocomplete="off">
      <button class="btn" id="addBtn">Thêm</button>
    </div>
    <div class="opts">
      <select id="prio">
        <option value="1">🔴 Ưu tiên cao</option>
        <option value="2" selected>🟡 Trung bình</option>
        <option value="3">🟢 Thấp</option>
      </select>
      <select id="cat">
        <option value="personal">🏠 Cá nhân</option>
        <option value="work">💼 Công việc</option>
        <option value="study">📚 Học tập</option>
      </select>
      <input id="due" type="date" title="Hạn chót">
    </div>
    <div class="tools">
      <input id="search" type="text" placeholder="🔍 Tìm kiếm... (phím /)" autocomplete="off">
      <select id="sort">
        <option value="new">Mới nhất</option>
        <option value="due">Hạn chót gần nhất</option>
        <option value="prio">Ưu tiên cao trước</option>
        <option value="name">Tên A → Z</option>
      </select>
      <select id="catF">
        <option value="all">Mọi phân loại</option>
        <option value="personal">🏠 Cá nhân</option>
        <option value="work">💼 Công việc</option>
        <option value="study">📚 Học tập</option>
      </select>
    </div>
    <div class="tabs">
      <button class="tab active" data-f="all">Tất cả</button>
      <button class="tab" data-f="todo">Đang làm</button>
      <button class="tab" data-f="done">Hoàn thành</button>
      <span class="sp"></span>
      <button class="mini" id="exportBtn">⬇ Xuất CSV</button>
      <button class="mini red" id="clearBtn">🧹 Xóa việc đã xong</button>
    </div>
    <ul id="list"></ul>
    <div class="hint">Phím tắt: <kbd>/</kbd> tìm kiếm · <kbd>N</kbd> thêm việc · bấm đúp tên để sửa</div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const CAT = { personal:'🏠 Cá nhân', work:'💼 Công việc', study:'📚 Học tập' };
const PRIO = { 1:'Cao', 2:'Trung bình', 3:'Thấp' };
let items = [], filter = 'all', timer;

const root = document.documentElement;
function setTheme(t){ root.dataset.theme = t; $('theme').textContent = t === 'dark' ? '☀️' : '🌙'; try{localStorage.setItem('theme', t)}catch(e){} }
let saved = null; try{ saved = localStorage.getItem('theme') }catch(e){}
setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('theme').onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');

const hr = new Date().getHours();
$('hello').textContent = (hr < 12 ? 'Chào buổi sáng' : hr < 18 ? 'Chào buổi chiều' : 'Chào buổi tối') + '! Sắp xếp một ngày thật gọn gàng.';

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(timer); timer = setTimeout(() => t.classList.remove('show'), 2000);
}
function confetti(){
  const colors = ['#6366f1','#ec4899','#f59e0b','#10b981','#3b82f6'];
  for (let i = 0; i < 60; i++){
    const d = document.createElement('div'); d.className = 'conf';
    d.style.left = Math.random()*100 + 'vw';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = (1.5 + Math.random()*1.5) + 's';
    d.style.animationDelay = Math.random()*.4 + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3500);
  }
}
async function api(url, method, body){
  const res = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) throw new Error('err');
  return res.json();
}
async function load(){
  try { items = await (await fetch('/items')).json(); render(); }
  catch(e){ toast('Không tải được dữ liệu'); }
}
function today(){ return new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10); }
function fmt(d){ return new Date(d).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}); }
function fmtDue(s){ const [y,m,d] = s.split('-'); return d + '/' + m + '/' + y; }

const ICON_EDIT = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
const ICON_DEL = '<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';
const ICON_CAL = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';

function render(){
  const t = today();
  const done = items.filter(i => i.done).length;
  const late = items.filter(i => !i.done && i.due_date && i.due_date < t).length;
  $('sAll').textContent = items.length; $('sDone').textContent = done;
  $('sTodo').textContent = items.length - done; $('sLate').textContent = late;
  $('bar').style.width = (items.length ? done/items.length*100 : 0) + '%';

  const q = $('search').value.trim().toLowerCase(), cf = $('catF').value, sort = $('sort').value;
  let shown = items.filter(i =>
    (filter === 'all' || (filter === 'done' ? i.done : !i.done)) &&
    (cf === 'all' || i.category === cf) &&
    i.name.toLowerCase().includes(q));
  const by = {
    new: (a,b) => b.id - a.id,
    due: (a,b) => (a.due_date || '9999').localeCompare(b.due_date || '9999'),
    prio: (a,b) => a.priority - b.priority,
    name: (a,b) => a.name.localeCompare(b.name, 'vi')
  };
  shown.sort(by[sort]);

  const list = $('list'); list.innerHTML = '';
  if (!shown.length){
    list.innerHTML = '<div class="empty"><div>🎉</div>' +
      (items.length ? 'Không có công việc nào ở đây' : 'Chưa có việc nào, hãy thêm việc đầu tiên!') + '</div>';
    return;
  }
  shown.forEach(it => {
    const li = document.createElement('li');
    if (it.done) li.className = 'done';

    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'chk'; cb.checked = it.done;
    cb.onchange = async () => {
      try {
        await api('/items/' + it.id, 'PUT', { done: cb.checked });
        it.done = cb.checked;
        toast(cb.checked ? '✅ Đã hoàn thành' : '↩️ Đã mở lại');
        if (cb.checked && items.length && items.every(x => x.done)){ confetti(); toast('🎉 Tuyệt vời! Xong hết rồi!'); }
        load();
      } catch { toast('Có lỗi xảy ra'); }
    };

    const txt = document.createElement('div'); txt.className = 'txt';
    const b = document.createElement('b'); b.textContent = it.name;
    const meta = document.createElement('div'); meta.className = 'meta';

    const cat = document.createElement('span'); cat.className = 'chip'; cat.textContent = CAT[it.category] || CAT.personal;
    const pr = document.createElement('button'); pr.className = 'chip p' + it.priority;
    pr.textContent = '● ' + PRIO[it.priority]; pr.title = 'Bấm để đổi mức ưu tiên';
    pr.onclick = async () => {
      try { await api('/items/' + it.id, 'PUT', { priority: it.priority % 3 + 1 }); load(); } catch { toast('Có lỗi xảy ra'); }
    };
    meta.append(cat, pr);
    if (it.due_date){
      const du = document.createElement('span'); du.className = 'chip';
      du.textContent = '📅 ' + fmtDue(it.due_date);
      if (!it.done && it.due_date < t){ du.classList.add('due-over'); du.textContent += ' · Quá hạn'; }
      else if (!it.done && it.due_date === t){ du.classList.add('due-today'); du.textContent += ' · Hôm nay'; }
      meta.append(du);
    }
    const cr = document.createElement('span'); cr.className = 'chip'; cr.textContent = '🕒 ' + fmt(it.created_at);
    meta.append(cr);
    txt.append(b, meta);
    txt.ondblclick = () => startEdit(it, b);

    const cal = document.createElement('button'); cal.className = 'ico'; cal.title = 'Đặt hạn chót'; cal.innerHTML = ICON_CAL;
    const di = document.createElement('input'); di.type = 'date'; di.className = 'hid'; di.value = it.due_date || '';
    di.onchange = async () => {
      try { await api('/items/' + it.id, 'PUT', { due_date: di.value }); toast('📅 Đã đặt hạn chót'); load(); } catch { toast('Có lỗi xảy ra'); }
    };
    cal.onclick = () => { try { di.showPicker(); } catch { di.focus(); di.click(); } };
    cal.append(di);

    const edit = document.createElement('button'); edit.className = 'ico'; edit.title = 'Sửa'; edit.innerHTML = ICON_EDIT;
    edit.onclick = () => startEdit(it, b);

    const del = document.createElement('button'); del.className = 'ico del'; del.title = 'Xóa'; del.innerHTML = ICON_DEL;
    del.onclick = async () => {
      li.classList.add('removing');
      try { await api('/items/' + it.id, 'DELETE'); setTimeout(() => { toast('🗑️ Đã xóa'); load(); }, 280); }
      catch { li.classList.remove('removing'); toast('Có lỗi xảy ra'); }
    };

    li.append(cb, txt, cal, edit, del);
    list.appendChild(li);
  });
}

function startEdit(it, bEl){
  const input = document.createElement('input');
  input.className = 'edit-in'; input.value = it.name; input.maxLength = 200;
  bEl.replaceWith(input); input.focus(); input.select();
  let finished = false;
  const save = async () => {
    if (finished) return; finished = true;
    const v = input.value.trim();
    if (v && v !== it.name){ try { await api('/items/' + it.id, 'PUT', { name: v }); toast('✏️ Đã cập nhật'); } catch { toast('Có lỗi xảy ra'); } }
    load();
  };
  input.onkeydown = e => { if (e.key === 'Enter') save(); if (e.key === 'Escape'){ finished = true; load(); } };
  input.onblur = save;
}

async function addItem(){
  const input = $('name'), v = input.value.trim();
  if (!v){ input.focus(); return; }
  try {
    await api('/items', 'POST', { name: v, priority: +$('prio').value, category: $('cat').value, due_date: $('due').value || null });
    input.value = ''; $('due').value = ''; toast('➕ Đã thêm'); load();
  } catch { toast('Có lỗi xảy ra'); }
}

function exportCsv(){
  if (!items.length){ toast('Chưa có dữ liệu để xuất'); return; }
  const esc = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = [['ID','Công việc','Phân loại','Ưu tiên','Hạn chót','Trạng thái','Ngày tạo']];
  items.forEach(i => rows.push([i.id, i.name, CAT[i.category] || '', PRIO[i.priority], i.due_date || '', i.done ? 'Hoàn thành' : 'Đang làm', fmt(i.created_at)]));
  const csv = '\uFEFF' + rows.map(r => r.map(esc).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = 'viec-can-lam.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('⬇ Đã xuất file CSV');
}
async function clearDone(){
  const n = items.filter(i => i.done).length;
  if (!n){ toast('Chưa có việc nào hoàn thành'); return; }
  if (!confirm('Xóa ' + n + ' việc đã hoàn thành?')) return;
  try { await api('/items/done', 'DELETE'); toast('🧹 Đã dọn ' + n + ' việc'); load(); } catch { toast('Có lỗi xảy ra'); }
}

$('addBtn').onclick = addItem;
$('exportBtn').onclick = exportCsv;
$('clearBtn').onclick = clearDone;
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
['search','sort','catF'].forEach(id => $(id).addEventListener(id === 'search' ? 'input' : 'change', render));
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active'); filter = t.dataset.f; render();
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || e.ctrlKey || e.metaKey) return;
  if (e.key === '/'){ e.preventDefault(); $('search').focus(); }
  if (e.key.toLowerCase() === 'n'){ e.preventDefault(); $('name').focus(); }
});
load();
</script>
</body>
</html>
